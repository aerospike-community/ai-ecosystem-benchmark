name: Terraform

on:
  workflow_dispatch:
    inputs:
      name_prefix:
        description: Terraform deployment identifier and prefix for created resources. Reuse the same value to update or destroy the same deployment.
        required: true
        type: string
      terraform_action:
        description: Terraform action to run.
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
      region:
        description: GCP region.
        required: true
        type: string
        default: us-central1
      zone:
        description: GCP zone.
        required: true
        type: string
        default: us-central1-a
      enable_aerospike:
        description: Provision Aerospike Community Edition.
        required: true
        type: boolean
        default: true
      aerospike_node_count:
        description: Aerospike node count.
        required: true
        type: number
        default: 1
      aerospike_replication_factor:
        description: Aerospike replication factor.
        required: true
        type: number
        default: 1
      aerospike_namespace:
        description: Aerospike namespace name.
        required: true
        type: string
        default: test
      enable_redis:
        description: Provision Redis.
        required: true
        type: boolean
        default: false
      redis_topology:
        description: Redis topology.
        required: true
        type: choice
        default: standalone
        options:
          - standalone
          - sentinel
      enable_postgres:
        description: Provision Postgres.
        required: true
        type: boolean
        default: false
      postgres_topology:
        description: Postgres topology.
        required: true
        type: choice
        default: standalone
        options:
          - standalone
          - replicated
      postgres_password:
        description: Postgres password for the bench user. Must be a minimum of 12 characters.
        required: true
        type: string
        default: benchpassword
      enable_local_access:
        description: Create the access needed for the copy-paste "Connect from your computer" command in the result summary.
        required: true
        type: boolean
        default: true
      enable_client:
        description: Provision a private benchmark client VM in the same VPC and zone as the backends.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.name_prefix }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_DIR: infra/terraform/gcp-compute
  GCP_PROJECT_ID: firefly-aerospike
  TF_VAR_project_id: firefly-aerospike
  TF_VAR_region: ${{ inputs.region }}
  TF_VAR_zone: ${{ inputs.zone }}
  TF_VAR_name_prefix: ${{ inputs.name_prefix }}
  TF_VAR_enable_local_access: ${{ inputs.enable_local_access }}
  TF_VAR_enable_client: ${{ inputs.enable_client }}
  TF_VAR_enable_aerospike: ${{ inputs.enable_aerospike }}
  TF_VAR_aerospike_node_count: ${{ inputs.aerospike_node_count }}
  TF_VAR_aerospike_replication_factor: ${{ inputs.aerospike_replication_factor }}
  TF_VAR_aerospike_namespace: ${{ inputs.aerospike_namespace }}
  TF_VAR_enable_redis: ${{ inputs.enable_redis }}
  TF_VAR_redis_topology: ${{ inputs.redis_topology }}
  TF_VAR_enable_postgres: ${{ inputs.enable_postgres }}
  TF_VAR_postgres_topology: ${{ inputs.postgres_topology }}
  TF_VAR_postgres_password: ${{ inputs.postgres_password }}

jobs:
  terraform:
    name: Terraform ${{ inputs.terraform_action }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::TF_STATE_BUCKET secret is required for the GCS Terraform backend."
            exit 1
          fi

          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=ai-ecosystem-benchmark/gcp-compute/${{ inputs.name_prefix }}"
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Terraform format check
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      # Phase 1 of apply provisions with egress on so the nodes can install
      # software. destroy tears everything down (egress off matches the locked
      # down end state). plan just previews the create-time configuration.
      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          if [ "${{ inputs.terraform_action }}" = "destroy" ]; then
            terraform plan -destroy -var="enable_egress=false" -out=tfplan
          else
            terraform plan -var="enable_egress=true" -out=tfplan
          fi

      - name: Terraform apply
        if: ${{ inputs.terraform_action == 'apply' || inputs.terraform_action == 'destroy' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

      # Each node writes the bench/ready guest attribute when its startup script
      # finishes. We poll that here so we only remove egress after installs complete.
      - name: Wait for VM installs to finish
        if: ${{ inputs.terraform_action == 'apply' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform output -json endpoints > endpoints.json
          terraform output -json client > client.json
          mapfile -t names < <(jq -nr '
            [
              (
                $endpoints
                | [.aerospike, .postgres, .redis]
                | map(select(. != null))
                | .[].nodes[].name
              ),
              (
                $client
                | select(. != null)
                | .name
              )
            ]
            | .[]
          ' --argjson endpoints "$(cat endpoints.json)" --argjson client "$(cat client.json)")

          if [ "${#names[@]}" -eq 0 ]; then
            echo "No nodes to wait for."
            exit 0
          fi

          # ~20 minutes per node (120 * 10s) to cover package installs and replica sync.
          for name in "${names[@]}"; do
            echo "Waiting for ${name} to finish provisioning..."
            ready=""
            for _ in $(seq 1 120); do
              ready="$(gcloud compute instances get-guest-attributes "${name}" \
                --zone "${TF_VAR_zone}" --project "${GCP_PROJECT_ID}" \
                --query-path=bench/ready 2>/dev/null | awk '/ready/ {print $NF}' || true)"
              if [ "${ready}" = "1" ]; then
                echo "${name} is ready."
                break
              fi
              sleep 10
            done
            if [ "${ready}" != "1" ]; then
              echo "::error::${name} did not report ready before the timeout. Egress was left enabled so you can inspect it."
              exit 1
            fi
          done

      # Phase 2: remove backend-node Cloud NAT now that installs are done. If a
      # client VM exists, its dedicated subnet keeps NAT for project downloads.
      - name: Lock down egress
        if: ${{ inputs.terraform_action == 'apply' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          terraform plan -var="enable_egress=false" -out=tfplan-lockdown
          terraform apply -auto-approve tfplan-lockdown

      - name: Print endpoints
        if: ${{ inputs.terraform_action == 'apply' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform output -json endpoints > endpoints.json
          terraform output -json network > network.json
          terraform output -json client > client.json

          has_backend() {
            jq -e ".$1 != null" endpoints.json >/dev/null
          }

          print_nodes() {
            local backend="$1"
            jq -r --arg backend "${backend}" '
              .[$backend].nodes[]
              | "- `\(.name)`: private/internal IP `\(.internal_ip)`"
            ' endpoints.json
          }

          {
            echo "## Terraform Deployment"
            echo
            echo "- **Project:** \`${GCP_PROJECT_ID}\`"
            echo "- **Prefix:** \`${TF_VAR_name_prefix}\`"
            echo "- **Region:** \`${TF_VAR_region}\`"
            echo "- **Zone:** \`${TF_VAR_zone}\`"
            echo "- **Network:** \`$(jq -r '.name' network.json)\`"
            echo "- **Backend subnet:** \`$(jq -r '.subnet_cidr' network.json)\`"
            if jq -e '.client_subnet_cidr != null' network.json >/dev/null; then
              echo "- **Client subnet:** \`$(jq -r '.client_subnet_cidr' network.json)\`"
            fi
            echo
            echo "### Which Address Should I Use?"
            echo
            echo "- **Running benchmarks on the Terraform client VM or another VM in this VPC:** use the private/internal host values below."
            echo "- **Connecting from your computer:** first run the command below, then use \`127.0.0.1\`."
            echo "- **Access control:** the tunnel command still requires GCP IAM/IAP/SSH authorization. Seeing this summary does not grant access."
            echo
            echo "A private/internal IP only works from another machine in the same benchmark VPC. It is not an address your computer can use directly."
            echo

            if jq -e '. != null' client.json >/dev/null; then
              echo "### Benchmark Client"
              echo
              echo "- **Instance:** \`$(jq -r '.name' client.json)\`"
              echo "- **Private/internal IP:** \`$(jq -r '.internal_ip' client.json)\`"
              echo "- **Upload directory:** \`$(jq -r '.workdir' client.json)\`"
              echo "- **Provisioned tools:** Python 3, \`uv\`, \`uvx\`, Git, rsync, build essentials, \`libpq5\`."
              echo "- **Outbound internet:** enabled through Cloud NAT with no external VM IP. Database nodes remain private after provisioning."
              echo
              if [ "${TF_VAR_enable_local_access}" = "true" ]; then
                echo "SSH to the client:"
                echo
                echo '```bash'
                jq -r '.ssh_command' client.json
                echo '```'
                echo
                echo "Upload a local benchmark project directory:"
                echo
                echo '```bash'
                jq -r '.upload_command' client.json
                echo '```'
              else
                echo "\`enable_local_access\` was disabled, so SSH and SCP over IAP are not available from your computer. Rerun \`apply\` with \`enable_local_access\` set to \`true\` when you want to upload a project or SSH to the client."
              fi
              echo
            fi

            if has_backend aerospike; then
              echo "### Aerospike"
              echo
              echo "- **Use from the Terraform client VM / GCP VPC:** \`$(jq -r '.aerospike.connection_string' endpoints.json)\`"
              echo "- **Use from your computer after running the command below:** \`aerospike://127.0.0.1:3000/$(jq -r '.aerospike.namespace' endpoints.json)\`"
              echo "- **Private host:** \`$(jq -r '.aerospike.host' endpoints.json)\`"
              echo "- **Port:** \`$(jq -r '.aerospike.port' endpoints.json)\`"
              echo "- **Namespace:** \`$(jq -r '.aerospike.namespace' endpoints.json)\`"
              echo "- **Nodes:**"
              print_nodes aerospike
              echo
            fi

            if has_backend postgres; then
              echo "### Postgres"
              echo
              echo "- **Use from the Terraform client VM / GCP VPC:** \`$(jq -r '.postgres.connection_string' endpoints.json)\`"
              echo "- **Use from your computer after running the command below:** \`postgresql://$(jq -r '.postgres.username' endpoints.json):<password>@127.0.0.1:5432/$(jq -r '.postgres.database' endpoints.json)\`"
              echo "- **Async from your computer after running the command below:** \`postgresql+asyncpg://$(jq -r '.postgres.username' endpoints.json):<password>@127.0.0.1:5432/$(jq -r '.postgres.database' endpoints.json)\`"
              echo "- **Private host:** \`$(jq -r '.postgres.host' endpoints.json)\`"
              echo "- **Port:** \`$(jq -r '.postgres.port' endpoints.json)\`"
              echo "- **Database:** \`$(jq -r '.postgres.database' endpoints.json)\`"
              echo "- **Username:** \`$(jq -r '.postgres.username' endpoints.json)\`"
              echo "- **Password:** use the \`postgres_password\` workflow input. The default is \`benchpassword\`."
              echo "- **Nodes:**"
              print_nodes postgres
              echo
            fi

            if has_backend redis; then
              echo "### Redis"
              echo
              echo "- **Use from the Terraform client VM / GCP VPC:** \`$(jq -r '.redis.url' endpoints.json)\`"
              echo "- **Use from your computer after running the command below:** \`redis://127.0.0.1:6379/0\`"
              echo "- **Private host:** \`$(jq -r '.redis.host' endpoints.json)\`"
              echo "- **Port:** \`$(jq -r '.redis.port' endpoints.json)\`"
              echo "- **Topology:** \`$(jq -r '.redis.topology' endpoints.json)\`"
              echo "- **Nodes:**"
              print_nodes redis
              echo
            fi

            bastion="$(jq -r '[.[] | select(. != null) | .nodes[0].name][0]' endpoints.json)"
            ssh_flags="$(jq -r '
              [
                (if .aerospike != null then "--ssh-flag=\"-L\" --ssh-flag=\"3000:\(.aerospike.host):\(.aerospike.port)\"" else empty end),
                (if .postgres != null then "--ssh-flag=\"-L\" --ssh-flag=\"5432:\(.postgres.host):\(.postgres.port)\"" else empty end),
                (if .redis != null then "--ssh-flag=\"-L\" --ssh-flag=\"6379:\(.redis.host):\(.redis.port)\"" else empty end),
                "--ssh-flag=\"-N\""
              ] | join(" ")
            ' endpoints.json)"
            local_services="$(jq -r '
              [
                (if .aerospike != null then "Aerospike `aerospike://127.0.0.1:3000/\(.aerospike.namespace)`" else empty end),
                (if .postgres != null then "Postgres `postgresql://\(.postgres.username):<password>@127.0.0.1:5432/\(.postgres.database)`" else empty end),
                (if .redis != null then "Redis `redis://127.0.0.1:6379/0`" else empty end)
              ] | join(", ")
            ' endpoints.json)"

            if [ -n "${bastion}" ] && [ -n "${ssh_flags}" ]; then
              echo "### Connect From Your Computer"
              echo
              if [ "${TF_VAR_enable_local_access}" = "true" ]; then
                echo "Run this command on your computer and leave it running. It opens a local connection path through Google Cloud without exposing database ports to the internet:"
                echo
                echo '```bash'
                echo "gcloud compute ssh ${bastion} --project ${GCP_PROJECT_ID} --zone ${TF_VAR_zone} --tunnel-through-iap ${ssh_flags}"
                echo '```'
                echo
                echo "Then connect to enabled services on \`127.0.0.1\`: ${local_services}."
              else
                echo "\`enable_local_access\` was disabled for this deployment. That is fine if your benchmark client runs in GCP. To connect from your computer, rerun \`apply\` with \`enable_local_access\` set to \`true\`."
              fi
              echo
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}"
